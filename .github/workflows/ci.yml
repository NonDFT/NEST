name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OMP_NUM_THREADS: 2
      SOCUTILS_REF: c1ebe464bde5060c3352038ad15e6ad3a9697c58
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install SOC build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake libopenblas-dev liblapack-dev
      - run: python -m pip install -e ".[dev]"
      - name: Check dispersion and optimization dependencies
        run: python -c "from pyscf.dispersion import dftd3, dftd4; import geometric"
      - name: Build socutils
        run: |
          git init "${RUNNER_TEMP}/socutils"
          git -C "${RUNNER_TEMP}/socutils" remote add origin \
            https://github.com/wtpeter/socutils.git
          git -C "${RUNNER_TEMP}/socutils" fetch --depth=1 origin "${SOCUTILS_REF}"
          git -C "${RUNNER_TEMP}/socutils" checkout --detach FETCH_HEAD
          make -C "${RUNNER_TEMP}/socutils" CMAKE_ARGS=-DBLA_VENDOR=OpenBLAS
          echo "PYTHONPATH=${RUNNER_TEMP}" >> "${GITHUB_ENV}"
      - name: Verify socutils SOC libraries
        run: |
          python -c "from socutils.lib import load_library; load_library('libx2camf_c')"
          python -c "from socutils.somf import somf_pt; from socutils.somf.x2cmp import SpinorX2CMPHelper"
      - run: python -m ruff check .
      - run: python -m pytest src -q
